services:
  - type: web
    name: institute-management-api
    env: node
    plan: starter
    rootDir: NodeAPI
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: JWT_EXPIRES_IN
        value: 1d
      - key: FCM_SERVER_KEY
        sync: false
      - key: SUPER_ADMIN_EMAIL
        value: superadmin@baliraja.com
      - key: SUPER_ADMIN_PASSWORD
        sync: false
      - key: SUPER_ADMIN_PHONE
        value: 9999999999
      - key: SUPER_ADMIN_FORCE_RESET
        value: "false"
      - key: BOOTSTRAP_KEY
        sync: false
      - key: REVENUE_PASS
        sync: false
      - key: CORS_ORIGIN
        value: https://your-vercel-domain.vercel.app
